stages:
  prepare:
    cmd: python src/prepare.py
    deps:
      - src/prepare.py
    outs:
      - data/raw/train_raw.npz
      - data/raw/test_raw.npz

  preprocess:
    cmd: python src/preprocess.py
    deps:
      - src/preprocess.py
      - data/raw/train_raw.npz
      - data/raw/test_raw.npz
    params:
      - preprocess.test_size
      - preprocess.seed
    outs:
      - data/processed/train.npz
      - data/processed/val.npz
      - data/processed/test.npz

  train:
    cmd: python src/train.py
    deps:
      - src/train.py
      - data/processed/train.npz
      - data/processed/val.npz
    params:
      - train.dense_units
      - train.dropout_rate
      - train.learning_rate
      - train.epochs
      - train.batch_size
    outs:
      - models/model.h5

  evaluate:
    cmd: python src/evaluate.py
    deps:
      - src/evaluate.py
      - models/model.h5
      - data/processed/test.npz
    metrics:
      - metrics.json:
          cache: false